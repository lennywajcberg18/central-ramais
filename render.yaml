# Blueprint do Render — sobe banco, API e web em um clique.
# Plano free em todos os três: os serviços hibernam após 15 min sem acesso e
# o Postgres gratuito expira em 30 dias. Serve para demonstração, não para uso real.

databases:
  - name: central-ramais-db
    databaseName: central_ramais
    user: central
    plan: free

services:
  - type: web
    name: central-ramais-api
    runtime: node
    plan: free
    buildCommand: >-
      npm install &&
      npm run build -w @central/shared &&
      npx prisma generate --schema apps/api/prisma/schema.prisma &&
      npm run build -w api
    # migrate deploy aplica as migrations; o seed só roda se o banco estiver vazio
    startCommand: >-
      npx prisma migrate deploy --schema apps/api/prisma/schema.prisma &&
      npx tsx apps/api/scripts/seed-if-empty.ts &&
      node apps/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        fromDatabase:
          name: central-ramais-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WHATSAPP_PROVIDER
        value: mock
      # origem do front, para o CORS. Se o Render alterar a URL do serviço web
      # (nome já em uso), corrija esta variável no painel.
      - key: WEB_ORIGIN
        value: https://central-ramais-web.onrender.com

  - type: web
    name: central-ramais-web
    runtime: node
    plan: free
    buildCommand: >-
      npm install &&
      npm run build -w @central/shared &&
      npm run build -w web
    startCommand: cd apps/web && npx next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: central-ramais-api
          envVarKey: RENDER_EXTERNAL_URL
