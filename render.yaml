# Blueprint do Render — sobe API e web em um clique. O banco não vem daqui: é um
# projeto Supabase em São Paulo, e as duas variáveis que apontam para ele entram
# na mão no painel (ver `docs/BANCO.md`).
# Plano free nos dois serviços: hibernam após 15 min sem acesso, e a primeira
# visita depois disso leva ~50s. O projeto do Supabase, também free, pausa após
# 7 dias sem atividade — pausado, ele recusa conexão e o /health responde 503.
# Serve para demonstração, não para uso real.

# Este Postgres não é mais o banco da aplicação — ela fala com o Supabase
# (projeto central-ramais, região São Paulo). O bloco continua aqui de propósito:
# apagá-lo do blueprint faz o Render descartar a instância, e um banco descartado
# não volta. Ele expira sozinho em 13/09/2026; até lá é só peso morto, e serve de
# rede se a migração precisar ser desfeita. Depois de confirmar o Supabase em uso,
# dá para removê-lo pelo painel.
databases:
  - name: central-ramais-db
    databaseName: central_ramais
    user: central
    plan: free

services:
  - type: web
    name: central-ramais-api
    runtime: node
    plan: free
    buildCommand: >-
      npm install &&
      npm run build -w @central/shared &&
      npx prisma generate --schema apps/api/prisma/schema.prisma &&
      npm run build -w api
    # migrate deploy aplica as migrations; o seed só roda com ALLOW_DEMO_SEED=true
    # (que este arquivo não publica) e o banco sem usuário. Erro de leitura no start
    # não impede a API de subir; só a falha do seed em si derruba o deploy, porque
    # aí o banco fica sem tenant e sem admin — API assim é inútil.
    startCommand: >-
      npx prisma migrate deploy --schema apps/api/prisma/schema.prisma &&
      npx tsx apps/api/scripts/seed-if-empty.ts &&
      node apps/api/dist/index.js
    # /health faz SELECT 1 no Postgres: 503 com o banco fora é o que faz o Render
    # reiniciar o serviço e barrar a promoção de um deploy que não conecta.
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      # As duas apontam para o MESMO banco do Supabase por caminhos diferentes, e
      # nenhuma delas pode ser a conexão direta: `db.<ref>.supabase.co` só tem
      # registro IPv6, e a rede do Render é IPv4 — de dentro daqui ela simplesmente
      # não existe. Ficam ambas no pooler, em modos diferentes:
      #   DATABASE_URL  → porta 6543, modo transação, com ?pgbouncer=true
      #   DIRECT_URL    → porta 5432, modo sessão (o `prisma migrate deploy` do
      #                   startCommand precisa da mesma conexão do início ao fim)
      # `sync: false` porque carregam a senha do banco, e este arquivo é versionado
      # num repositório público. Os valores entram pelo painel do Render.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WHATSAPP_PROVIDER
        value: mock
      # --- Twilio: contrato do boot, para quem for ligar a integração ---
      # Trocar WHATSAPP_PROVIDER para "twilio" pelo painel exige as três variáveis
      # abaixo. Faltando TWILIO_AUTH_TOKEN ou TWILIO_VALIDATE_WEBHOOK=true, o
      # processo sai com 1 no boot (apps/api/src/config.ts) — de propósito: um
      # webhook sem validação de assinatura aceita mensagem forjada de qualquer
      # origem, e o único campo que resolve o tenant (`To`) é público.
      # SID e token ficam comentados porque são segredo: preencha no painel do
      # Render, nunca neste arquivo, que é versionado num repositório público.
      # A validação da assinatura vem no mesmo bloco, e não solta: ligada com o
      # provider mock não existe token com que validar, e o middleware do SDK
      # responde sozinho 400 (sem o header X-Twilio-Signature) ou 500 (com ele),
      # sem passar pelo nosso handler — 500 é justamente o que faz o Twilio
      # reentregar em loop. Ligue as três juntas ou nenhuma.
      # - key: TWILIO_ACCOUNT_SID
      #   sync: false
      # - key: TWILIO_AUTH_TOKEN
      #   sync: false
      # - key: TWILIO_VALIDATE_WEBHOOK
      #   value: 'true'
      # Seed de demonstração, comentado de propósito: com ele ligado e o banco sem
      # usuários, o primeiro start cria admin@hospitalvida.test e
      # admin@reabilitar.test com senha 123456, expostos na internet. Publicar o
      # valor aqui faria todo clone deste blueprint nascer assim. Para montar uma
      # instância de demonstração, adicione ALLOW_DEMO_SEED=true no painel do Render
      # e reinicie o serviço.
      # - key: ALLOW_DEMO_SEED
      #   value: 'true'
      # origem do front, para o CORS. Se o Render alterar a URL do serviço web
      # (nome já em uso), corrija esta variável no painel.
      - key: WEB_ORIGIN
        value: https://central-ramais-web.onrender.com

  - type: web
    name: central-ramais-web
    runtime: node
    plan: free
    buildCommand: >-
      npm install &&
      npm run build -w @central/shared &&
      npm run build -w web
    startCommand: cd apps/web && npx next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: central-ramais-api
          envVarKey: RENDER_EXTERNAL_URL
